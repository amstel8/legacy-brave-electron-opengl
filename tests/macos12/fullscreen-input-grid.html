<!doctype html><meta charset="utf-8"><title>Fullscreen coordinate diagnostic</title><style>body{margin:0;background:#20252c;color:white;font:16px sans-serif}#grid{position:absolute;inset:4px 25px 25px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,24px);gap:6px}button{border:0;color:white;font:bold 12px sans-serif}#status{position:fixed;bottom:10px;left:20px}</style><div id="grid"></div><div id="status">Native click coordinate test — separate profile</div><script>window.events=[];window.moves=[];window.geo=()=>({w:innerWidth,h:innerHeight,ow:outerWidth,oh:outerHeight,sx:screenX,sy:screenY,dpr:devicePixelRatio,vv:{w:visualViewport.width,h:visualViewport.height,x:visualViewport.offsetLeft,y:visualViewport.offsetTop},buttons:[...document.querySelectorAll('button')].map(b=>({id:b.id,color:b.dataset.color,rect:b.getBoundingClientRect().toJSON()}))});for(let i=0;i<24;i++){let b=document.createElement('button');b.id='b'+i;let rgb=[50+(i%6)*30,65+Math.floor(i/6)*35,105+(i%3)*30];b.dataset.color=rgb.join(',');b.style.backgroundColor='rgb('+rgb.join(',')+')';b.textContent='Button '+i;grid.append(b)}document.addEventListener('pointermove',e=>{window.moves.push({trusted:e.isTrusted,x:e.clientX,y:e.clientY,sx:e.screenX,sy:e.screenY,target:e.target.id,time:performance.now()});if(moves.length>300)moves.shift()});document.addEventListener('click',e=>{let r={x:e.clientX,y:e.clientY,sx:e.screenX,sy:e.screenY,target:e.target.id,trusted:e.isTrusted,time:performance.now()};events.push(r);document.getElementById("status").textContent=JSON.stringify(r)});</script>
